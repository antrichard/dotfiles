# Binding a key to reload .tmux.conf
unbind r
bind r source-file ~/.tmux.conf \; display-message "Configuration loaded !"
set-option -g display-time 2000

# Start window numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1
# Automatically renumber windows when one is closed
set -g renumber-windows on

# Open new window or split panes keeping the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Enable mouse support
set -g mouse on

# Increase history limit
set -g history-limit 10000

# 256 color support
#set -g default-terminal "tmux-256color"
#set-option -sa terminal-overrides ',xterm-256color:RGB'

# Vi key binding
set -g status-keys vi
set -g mode-keys vi

# Copy selected text to tmux and, when supported, the system clipboard
set -s set-clipboard on

# In vi copy mode: press y to copy and exit
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# For WSL
#bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"

# Makes tmux monitor each window for activity. When output appears in an inactive window, tmux can mark that window in the status bar.
set -g monitor-activity on
set -g visual-activity on


# =====================================================================
# THÈME MINIMALISTE TOKYO NIGHT (SANS PLUGIN)
# =====================================================================

# Position de la barre (top pour la modernité, ou bottom)
set -g status-position top
set -g status-justify left

# Couleurs de base de Tokyo Night
# #1a1b26 : Fond sombre Tokyo Night (utilisé si votre terminal n'est pas transparent)
# bg=default permet de conserver la transparence de votre terminal
set -g status-style "bg=default fg=#787c99"

# Message d'alerte ou mode commande
set -g message-style "bg=#1f2335 fg=#7aa2f7,bold"

# ── ASTUCE POUR LA MARGE / L'ESPACE EN-DESSOUS ───────────────────────
# On demande à tmux d'afficher 2 lignes pour la barre de statut
#set -g status 2

# La ligne [0] devient notre vraie barre de statut avec votre design
#set -g status-format[0] "#[bg=default fg=#787c99]#{status-left}#{status-format-windows}#[align=right]#{status-right}"

# La ligne [1] (en-dessous) est laissée totalement vide pour créer l'espace
#set -g status-format[1] ""

# On utilise la syntaxe explicite par index [0] et [1] gérée par toutes les versions
#set -g status-format[0] "#[bg=default fg=#787c99]#{status-left}#{status-format-windows}#[align=right]#{status-right}"
#set -g status-format[1] "#[bg=default]"

set -g pane-border-status top
set -g pane-border-lines single
#set -g pane-border-lines simple
set -g pane-border-format ""


# ─────────────────────────────────────────────────────────────────────

# ---------------------------------------------------------------------
# SECTION GAUCHE (Nom de la session)
# ---------------------------------------------------------------------
# Affiche le nom de la session en bleu/cyan Tokyo Night discret
set -g status-left "#[fg=#1def92,bg=#24283b,bold] Session #S #[bg=default fg=#24283b] "
#set -g status-left "#[fg=#1def92,bg=#24283b,bold] Session #S #[bg=default fg=#24283b] "
set -g status-left-length 30

# ---------------------------------------------------------------------
# ONGLETS / FENÊTRES
# ---------------------------------------------------------------------
# Fenêtre inactive (Gris bleuté discret)
setw -g window-status-format "#[fg=#565f89] #I:#W "

# Fenêtre active (Texte blanc/bleu, surlignage violet Tokyo Night)
setw -g window-status-current-format "#[fg=#7aa2f7,bold,bg=#24283b] #I:#W* #[bg=default]"

# ---------------------------------------------------------------------
# SECTION DROITE (Date & Heure)
# ---------------------------------------------------------------------
# Un rappel minimaliste de l'heure avec une touche de violet (#bb9af7)
set -g status-right "#[fg=#565f89] %Y-%m-%d #[fg=#bb9af7]• #[fg=#7aa2f7,bold]%H:%M "
set -g status-right-length 50

# ---------------------------------------------------------------------
# BORDURES DES PANNEAUX (Panes)
# ---------------------------------------------------------------------
# Bordure du panneau actif en bleu Tokyo Night, inactif en sombre
set -g pane-border-style "bg=black fg=black"
set -g pane-active-border-style "fg=#24283b" # light grey
#set -g pane-active-border-style "bg=black fg=#7aa2f7,dim" # light cyan


